name: Check discounts

on:
  schedule:
    - cron: "17 * * * *"   # hourly (minute 17 avoids the top-of-hour rush)
  workflow_dispatch:        # manual run from the Actions tab

concurrency:
  group: check-discounts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      # Restore last-seen prices so we don't re-alert on the same price.
      - name: Restore price database
        uses: actions/cache/restore@v4
        with:
          path: robodiscounts.db
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Write config
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then
            printf '%s\n' "$CONFIG_YAML" > config.yaml
          else
            echo "Secret CONFIG_YAML not set; falling back to config.example.yaml"
            cp config.example.yaml config.yaml
          fi

      - name: Check prices and send WhatsApp alerts
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          WHATSAPP_STATUS_TEMPLATE: ${{ secrets.WHATSAPP_STATUS_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANG: ${{ vars.WHATSAPP_TEMPLATE_LANG || 'en_US' }}
          ROBODISCOUNTS_DEBUG_DIR: debug
        run: python -m robodiscounts.cli check

      # Static dashboard from the price history. Always built, even if the check failed.
      - name: Build dashboard
        if: always()
        run: python -m robodiscounts.cli dashboard

      - name: Upload dashboard (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
          if-no-files-found: ignore
          retention-days: 7

      # Optional public web page: set repo variable ENABLE_PAGES=true (see README).
      - name: Package dashboard for GitHub Pages
        if: always() && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Save price database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: robodiscounts.db
          key: prices-${{ github.run_id }}

      # On failures, the page HTML and a screenshot of what the site returned.
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

  deploy-dashboard:
    needs: check
    if: ${{ always() && vars.ENABLE_PAGES == 'true' && needs.check.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
