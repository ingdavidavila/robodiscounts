# Copy to config.yaml and edit.
db_path: robodiscounts.db
check_interval_minutes: 60     # used by `watch` mode
request_delay_seconds: 5       # pause between pages (be polite, avoid bans)
fail_alert_after: 3            # WhatsApp warning after N failed checks in a row (0 = off)

items:
  # Sealed product vs MSRP. Set `msrp` to the product's official retail price
  # (look it up yourself; the bot does not know it).
  #   max_percent_of_msrp: 100  -> alert at or below MSRP (this is the default)
  #   max_percent_of_msrp: 90   -> alert at 10% or more below MSRP
  #   max_percent_of_msrp: 130  -> alert up to 30% over MSRP (useful for hot sets)
  - name: Pokemon booster bundle (Best Buy)
    url: https://www.bestbuy.com/site/pokemon-tcg-scarlet-violet-booster-bundle/6578291.p?skuId=6578291
    msrp: 26.94                # placeholder: replace with the real MSRP and product URL
    max_percent_of_msrp: 100
    alert_on_restock: true     # also alert when it comes back in stock (Best Buy)

  - name: Pokemon Elite Trainer Box (TCGplayer)
    url: https://www.tcgplayer.com/product/593355
    msrp: 49.99                # placeholder
    max_percent_of_msrp: 130   # market prices run above MSRP, so allow some premium

  - name: MTG booster box (Card Kingdom)
    url: https://www.cardkingdom.com/catalog/item/REPLACE_WITH_REAL_ITEM_PAGE
    msrp: 150                  # placeholder
    max_percent_of_msrp: 100
